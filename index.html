<html lang="he" dir="rtl">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/icon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7da" />
    <meta name="application-name" content="My Scanner" />
    <meta
      name="description"
      content="My Scanner - document scanning, page straighten, and PDF export"
    />
    <meta property="og:title" content="My Scanner" />
    <meta property="og:description" content="My Scanner - document scanning, page straighten, and PDF export" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="My Scanner" />
    <meta name="twitter:description" content="My Scanner - document scanning, page straighten, and PDF export" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>My Scanner</title>
    <script>
      try {
        var stored = localStorage.getItem('folio-theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var themeMeta = document.querySelector('meta[name="theme-color"]')
        if (themeMeta) themeMeta.setAttribute('content', dark ? '#0e1614' : '#efe7da')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
